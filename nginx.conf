server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Seite, Service Worker und Manifest nie lange cachen – sonst kommen Updates nicht an.
  location = /sw.js               { add_header Cache-Control "no-cache"; }
  location = /index.html          { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; types { } add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; add_header Cache-Control "public, max-age=86400"; }
}
